name: Fetch vinyl covers (one-off)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scan/fetch-covers.sh"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: bash scan/fetch-covers.sh
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scan/covers
          git diff --cached --quiet || git commit -m "scan: vinyl cover sources"
          git pull --rebase -q origin main && git push -q origin HEAD:main
