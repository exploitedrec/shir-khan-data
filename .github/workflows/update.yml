name: Update data

on:
  schedule:
    # Daily 05:17 UTC (12:17 Bangkok, 06:17 Berlin) and a second pass 17:17 UTC on release Fridays' eve.
    - cron: "17 5 * * *"
    - cron: "17 17 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "data/upcoming.manual.json", ".github/workflows/update.yml"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Unit tests
        run: node --test scripts/lib.test.mjs
      - name: Fetch Apple, Bandcamp, exploitedghetto.de
        run: node scripts/update.mjs
      - name: Commit changes
        run: |
          if git diff --quiet -- data; then echo "No data changes."; exit 0; fi
          git config user.name "shir-khan-data bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: update $(date -u +%Y-%m-%d)"
          # main may have moved while the job ran (manual edit, other run): rebase instead of failing the push.
          git pull --rebase --autostash origin main
          git push
